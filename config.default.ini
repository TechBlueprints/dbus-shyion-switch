[DEFAULT]
# Shyion BLE Relay Switch Configuration

# How often to scan for new BBKS relay devices when discovery is enabled (seconds)
scan_interval = 60

# BLE device name prefixes to match during scanning (comma-separated).
# Shyion battery kill switches advertise as "BBKS-XXXX".
name_prefixes = BBKS

# How often to poll relay state in minutes (default 60).
# Each poll connects to the device, reads state, and disconnects.
# Set to 0 to disable periodic polling.
poll_interval_minutes = 60

# ─────────────────────────────────────────────────────────────────────────────
# BLE adapter coordination
# ─────────────────────────────────────────────────────────────────────────────
# Passed verbatim to the bleak-connection-manager catcher, which routes every
# BLE connect and scan this driver makes and coordinates with the other BLE
# services on this GX through /run/bt-claims.

# Which adapters this driver may use (comma-separated).
#   hciX          adds that adapter to the shared pool
#   MAC@hciX      pins that device to that adapter; repeat the MAC for an
#                 ordered preference list.  A pinned device never falls back
#                 to the pool.
# Leave empty to let every adapter the kernel exposes be a candidate, which
# still spreads load across them.
adapters =

# Optional per-adapter established-link capacity, "hciX:N,hciY:M".
# Dongle limits are undocumented, so these are deployment config rather than
# something the library can discover -- roughly 5 for CSR adapters, 7 for
# Broadcom.  Uncapped adapters are never gated.
link_caps =

# ─────────────────────────────────────────────────────────────────────────────
# Per-device configuration
# ─────────────────────────────────────────────────────────────────────────────
# Devices are auto-discovered when the provisioning tool (provision.py) is run.
# It logs into the Shyion cloud, fetches your device list, and writes device
# sections below with the correct BLE MAC addresses.
#
# You can also add devices manually.  The 'mac' field must be the actual BLE
# advertisement MAC address (not the Shyion backend uniqueid, which is
# byte-reversed).
#
# To provision:
#   python3 provision.py --email your@email.com
#
# Example device section:
#
# [Fridge_Switch]
# name = Fridge Switch
# mac = AA:BB:CC:DD:EE:FF
# model = Bluetooth Battery Kill Switch-200A
